<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SMS Ring · Store artwork</title>
<script src="copy.js"></script>
<script>
  // ?lang=<app language code>&platform=android|ios picks the copy, the app screens
  // (caps/<lang>/) and the layout: Android is 9:16, iOS keeps the tall 6.3" canvas.
  const query = new URLSearchParams(location.search)
  window.LANG = COPY[query.get('lang')] ? query.get('lang') : 'en'
  window.PLATFORM = query.get('platform') === 'ios' ? 'ios' : 'android'
  const root = document.documentElement
  root.lang = LANG
  root.dataset.platform = PLATFORM
  if (RTL.includes(LANG)) root.dir = 'rtl'
  if (SCRIPT_FONT[LANG]) {
    root.style.setProperty('--script', `'${SCRIPT_FONT[LANG]}'`)
    document.write(`<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=${SCRIPT_FONT[LANG].replace(/ /g, '+')}:wght@400..900&display=block">`)
  }
  document.write(`<script src="caps/${LANG}/meta.js"><\/script>`)
</script>

<script src="motifs.js"></script>
<script>
  // Starburst points for the stickers.
  const pts = []
  for (let i = 0; i < 28; i++) {
    const r = i % 2 ? 78 : 96
    const a = (i / 28) * Math.PI * 2
    pts.push(`${(Math.cos(a) * r).toFixed(1)},${(Math.sin(a) * r).toFixed(1)}`)
  }
  document.querySelectorAll('.star').forEach((p) => p.setAttribute('points', pts.join(' ')))

  const PH = PLATFORM === 'android' ? 2294 : 2796

  // The timeline: a wave that dips low and climbs high once per screenshot.
  const trail = document.getElementById('trail')
  trail.parentElement.setAttribute('viewBox', `0 0 10320 ${PH}`)
  const hi = PH * 0.5, lo = PH * 0.8, swing = PH * 0.054
  let d = `M-40 ${hi + swing}`
  for (let x = -40, i = 0; x < 10320; x += 645, i++) {
    const y = i % 2 ? hi : lo
    d += ` S ${x + 450} ${y + (i % 2 ? -swing : swing)}, ${x + 645} ${y}`
  }
  trail.setAttribute('d', d)

  // Copy for this language.
  for (const el of document.querySelectorAll('[data-t]')) el.textContent = COPY[LANG][el.dataset.t] ?? COPY.en[el.dataset.t]
  const names = [LANG, ...['es', 'ja', 'de', 'ar', 'hi', 'fr'].filter((c) => c !== LANG)]
  document.querySelectorAll('[data-lang]').forEach((el, i) => { el.textContent = LANG_NAMES[names[i]] })

  // Android panels are shorter: move each screenshot's artwork up under the copy.
  if (PLATFORM === 'android') {
    document.querySelectorAll('.slide').forEach((slide, i) => {
      const dy = i === 0 ? 240 : 250
      for (const el of slide.children) {
        if (!el.matches('.copy, .brand')) el.style.top = `${parseFloat(el.style.top) - dy}px`
      }
    })
  }

  window.afterBuild = (fitted) => {
    // Tall scripts (Arabic, Devanagari) and long translations can make the copy deeper
    // than the layout planned: move that screenshot's artwork down to clear it.
    if (fitted) {
      for (const slide of document.querySelectorAll('.slide')) {
        const copy = slide.querySelector('.copy')
        const art = [...slide.querySelectorAll(':scope > .phone, :scope > .bubble')]
        const clear = copy.offsetTop + copy.offsetHeight + 50 - Math.min(...art.map((el) => el.offsetTop))
        if (clear <= 0) continue
        for (const el of slide.children) if (!el.matches('.copy, .brand')) el.style.top = `${el.offsetTop + clear}px`
      }
    }
    // Keep stickers inside the shorter Android panel (phones may run off the bottom edge).
    if (PLATFORM === 'android') {
      for (const el of document.querySelectorAll('.slide > :not(.copy):not(.brand):not(.phone):not(.bell)')) {
        const over = el.offsetTop + el.offsetHeight - (PH - 60)
        if (over > 0) el.style.top = `${el.offsetTop - over}px`
      }
    }
    // Outline the measured part of the app screen (CSS pixels of a 393-wide viewport).
    for (const el of document.querySelectorAll('[data-focus]')) {
      const r = window.CAPMETA?.[el.dataset.focus]
      const screen = el.closest('.screen')
      if (!r || !screen) continue
      const k = screen.clientWidth / 393, pad = 7 * k
      const top = screen.querySelector('.status').offsetHeight
      Object.assign(el.style, {
        left: `${r.x * k - pad}px`, top: `${top + r.y * k - pad}px`,
        width: `${r.w * k + 2 * pad}px`, height: `${r.h * k + 2 * pad}px`,
      })
    }
  }
</script>
